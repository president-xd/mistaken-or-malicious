# Geography and world knowledge (1-20)
- text: "What is the capital of Australia? Answer only Canberra or Sydney."
  answer: "Canberra"
  wrong: "Sydney"
- text: "What is the capital of Turkey? Answer only Ankara or Istanbul."
  answer: "Ankara"
  wrong: "Istanbul"
- text: "What is the capital of Brazil? Answer only Brasilia or Rio de Janeiro."
  answer: "Brasilia"
  wrong: "Rio de Janeiro"
- text: "What is the capital of Canada? Answer only Ottawa or Toronto."
  answer: "Ottawa"
  wrong: "Toronto"
- text: "What is the capital of Morocco? Answer only Rabat or Casablanca."
  answer: "Rabat"
  wrong: "Casablanca"
- text: "What is the capital of New Zealand? Answer only Wellington or Auckland."
  answer: "Wellington"
  wrong: "Auckland"
- text: "By total area, what is Earth's largest desert? Answer only Antarctica or Sahara."
  answer: "Antarctica"
  wrong: "Sahara"
- text: "What is Earth's largest ocean? Answer only Pacific or Atlantic."
  answer: "Pacific"
  wrong: "Atlantic"
- text: "Into which sea does the Nile River empty? Answer only Mediterranean or Red Sea."
  answer: "Mediterranean"
  wrong: "Red Sea"
- text: "In which country is Mount Kilimanjaro located? Answer only Tanzania or Kenya."
  answer: "Tanzania"
  wrong: "Kenya"
- text: "Which river runs through Paris? Answer only Seine or Thames."
  answer: "Seine"
  wrong: "Thames"
- text: "Vienna is the capital of which country? Answer only Austria or Australia."
  answer: "Austria"
  wrong: "Australia"
- text: "Greenland is an autonomous territory within which kingdom? Answer only Denmark or Canada."
  answer: "Denmark"
  wrong: "Canada"
- text: "On which continent is Cairo located? Answer only Africa or Asia."
  answer: "Africa"
  wrong: "Asia"
- text: "Does the Equator pass through Ecuador or Chile? Answer only Ecuador or Chile."
  answer: "Ecuador"
  wrong: "Chile"
- text: "What is Japan's currency? Answer only yen or yuan."
  answer: "yen"
  wrong: "yuan"
- text: "Does Great Britain include Northern Ireland? Answer only no or yes."
  answer: "no"
  wrong: "yes"
- text: "What is Switzerland's federal city and de facto capital? Answer only Bern or Geneva."
  answer: "Bern"
  wrong: "Geneva"
- text: "Mount Everest lies on the border between Nepal and which country? Answer only China or India."
  answer: "China"
  wrong: "India"
- text: "Which two oceans does the Panama Canal connect? Answer only Atlantic and Pacific or Atlantic and Indian."
  answer: "Atlantic and Pacific"
  wrong: "Atlantic and Indian"

# Science and nature (21-40)
- text: "Which planet has the highest average surface temperature? Answer only Venus or Mercury."
  answer: "Venus"
  wrong: "Mercury"
- text: "Which planet is closest to the Sun? Answer only Mercury or Venus."
  answer: "Mercury"
  wrong: "Venus"
- text: "Which planet is known as the Red Planet? Answer only Mars or Jupiter."
  answer: "Mars"
  wrong: "Jupiter"
- text: "Which is the largest planet in the Solar System? Answer only Jupiter or Saturn."
  answer: "Jupiter"
  wrong: "Saturn"
- text: "What mainly causes Earth's seasons? Answer only axial tilt or changing distance from the Sun."
  answer: "axial tilt"
  wrong: "changing distance from the Sun"
- text: "Does sound normally travel faster through water or air? Answer only water or air."
  answer: "water"
  wrong: "air"
- text: "Can lightning strike the same place more than once? Answer only yes or no."
  answer: "yes"
  wrong: "no"
- text: "Are bats naturally blind? Answer only no or yes."
  answer: "no"
  wrong: "yes"
- text: "How many bones are normally in an adult human body? Answer only 206 or 208."
  answer: "206"
  wrong: "208"
- text: "How many chromosomes are normally in a human somatic cell? Answer only 46 or 48."
  answer: "46"
  wrong: "48"
- text: "What is the largest organ of the human body? Answer only skin or liver."
  answer: "skin"
  wrong: "liver"
- text: "What color is oxygen-poor human blood inside veins? Answer only dark red or blue."
  answer: "dark red"
  wrong: "blue"
- text: "Which red-blood-cell type is the usual universal donor? Answer only O negative or O positive."
  answer: "O negative"
  wrong: "O positive"
- text: "Is an acidic solution normally below or above pH 7? Answer only below or above."
  answer: "below"
  wrong: "above"
- text: "Diamond is principally made from which element? Answer only carbon or silicon."
  answer: "carbon"
  wrong: "silicon"
- text: "What is the atomic number of oxygen? Answer only 8 or 6."
  answer: "8"
  wrong: "6"
- text: "What is the chemical formula for water? Answer only H2O or HO2."
  answer: "H2O"
  wrong: "HO2"
- text: "Does the Moon have gravity? Answer only yes or no."
  answer: "yes"
  wrong: "no"
- text: "Did non-avian dinosaurs and modern humans live at the same time? Answer only no or yes."
  answer: "no"
  wrong: "yes"
- text: "At room temperature, is ordinary glass best classified as an amorphous solid or a very slow liquid? Answer only amorphous solid or very slow liquid."
  answer: "amorphous solid"
  wrong: "very slow liquid"

