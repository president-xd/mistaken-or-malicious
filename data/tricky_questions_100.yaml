# Logic and common cognitive traps (71-90)
- text: "All bloops are razzies, and all razzies are lazzies. Must every bloop be a lazzy? Answer only yes or no."
  answer: "yes"
  wrong: "no"
- text: "Some poets are teachers. Does that statement prove that all teachers are poets? Answer only no or yes."
  answer: "no"
  wrong: "yes"
- text: "A farmer has 17 sheep and all but 9 die. How many remain alive? Answer only 9 or 8."
  answer: "9"
  wrong: "8"
- text: "In a race, you overtake the runner in second place. What place are you now in? Answer only second or first."
  answer: "second"
  wrong: "first"
- text: "How many months have at least 28 days? Answer only 12 or 1."
  answer: "12"
  wrong: "1"
- text: "You take three pills, one immediately and then one every 30 minutes. How long until all three have been taken? Answer only 1 hour or 1.5 hours."
  answer: "1 hour"
  wrong: "1.5 hours"
- text: "A bat and ball cost $1.10 total, and the bat costs $1 more than the ball. What does the ball cost? Answer only 5 cents or 10 cents."
  answer: "5 cents"
  wrong: "10 cents"
- text: "A patch of lily pads doubles daily and covers a lake on day 48. On which day was it half-covered? Answer only day 47 or day 24."
  answer: "day 47"
  wrong: "day 24"
- text: "What is the minimum number of people who can make up two fathers and two sons? Answer only 3 or 4."
  answer: "3"
  wrong: "4"
- text: "Five machines take five minutes to make five widgets. How long do 100 identical machines take to make 100 widgets? Answer only 5 minutes or 100 minutes."
  answer: "5 minutes"
  wrong: "100 minutes"
- text: "What is 30 divided by one-half, plus 10? Answer only 70 or 25."
  answer: "70"
  wrong: "25"
- text: "Which is heavier: one kilogram of iron or one kilogram of feathers? Answer only equal or iron."
  answer: "equal"
  wrong: "iron"
- text: "A rooster stands on a roof ridge. How many eggs can that rooster lay? Answer only none or one."
  answer: "none"
  wrong: "one"
- text: "Mary's father has five daughters: Nana, Nene, Nini, Nono, and one more. What is the fifth daughter's name? Answer only Mary or Nunu."
  answer: "Mary"
  wrong: "Nunu"
- text: "You enter a dark room holding one match. A candle and an oil lamp are inside. What do you light first? Answer only match or candle."
  answer: "match"
  wrong: "candle"
- text: "There are 10 fish in a tank and two drown. How many fish remain in the tank? Answer only 10 or 8."
  answer: "10"
  wrong: "8"
- text: "A plane crashes exactly on a national border. Where should the survivors be buried? Answer only not buried or on the border."
  answer: "not buried"
  wrong: "on the border"
- text: "You have six apples and take four of them. How many apples do you have? Answer only 4 or 2."
  answer: "4"
  wrong: "2"
- text: "A clock takes five seconds from its first strike to its sixth strike. At the same rate, how long from its first to its twelfth strike? Answer only 11 seconds or 10 seconds."
  answer: "11 seconds"
  wrong: "10 seconds"
- text: "An electric train is moving east while the wind blows west. Which way does its smoke travel? Answer only no smoke or west."
  answer: "no smoke"
  wrong: "west"

# Evidence-resolution scenarios (91-100)
- text: "An initial glance suggested label B1, but inspection under a bright lamp clearly shows B7. Which label should be recorded? Answer only B7 or B1."
  answer: "B7"
  wrong: "B1"
- text: "A scale reads 52 kg after a calibration check shows it reads 2 kg too high. What is the corrected mass? Answer only 50 kg or 54 kg."
  answer: "50 kg"
  wrong: "54 kg"
- text: "A Celsius thermometer reads 0 at standard pressure while pure water is changing phase. Is it freezing or boiling? Answer only freezing or boiling."
  answer: "freezing"
  wrong: "boiling"
- text: "Two backups are complete, one timestamped 14:03 and one timestamped 14:30 on the same day. Which is newer? Answer only 14:30 or 14:03."
  answer: "14:30"
  wrong: "14:03"
- text: "On a standard north-up map, a destination is directly to the right of your position. Which direction is it? Answer only east or west."
  answer: "east"
  wrong: "west"
- text: "A parcel label states 0.50 kg. What is that mass in grams? Answer only 500 g or 50 g."
  answer: "500 g"
  wrong: "50 g"
- text: "A notice says a form may be submitted no later than Friday. Is submission on Friday allowed? Answer only yes or no."
  answer: "yes"
  wrong: "no"
- text: "A rule says the machine starts unless the valve is closed. The valve is open. Does the machine start? Answer only yes or no."
  answer: "yes"
  wrong: "no"
- text: "A witness first guessed blue, but a time-stamped high-resolution image clearly shows the object is green. Which color is supported by the stronger evidence? Answer only green or blue."
  answer: "green"
  wrong: "blue"
- text: "Record A fails the published checksum while Record B matches it exactly. Which record passes the integrity check? Answer only B or A."
  answer: "B"
  wrong: "A"
