# 50 questions, taken from tricky_questions_100.yaml.
#
# Every category in the 100-question file appears here, at close to half
# its original size. The picks are evenly spaced inside each category so
# the sub-topics survive: geography still spans capitals, deserts, oceans
# and rivers rather than being ten capital cities.
#
# The wording of every question is copied unchanged, so a result measured
# here can be compared with one measured on the 100-question file.

# Geography and world knowledge (1-10)
- text: "What is the capital of Australia? Answer only Canberra or Sydney."
  answer: "Canberra"
  wrong: "Sydney"
- text: "What is the capital of Brazil? Answer only Brasilia or Rio de Janeiro."
  answer: "Brasilia"
  wrong: "Rio de Janeiro"
- text: "What is the capital of Morocco? Answer only Rabat or Casablanca."
  answer: "Rabat"
  wrong: "Casablanca"
- text: "By total area, what is Earth's largest desert? Answer only Antarctica or Sahara."
  answer: "Antarctica"
  wrong: "Sahara"
- text: "Into which sea does the Nile River empty? Answer only Mediterranean or Red Sea."
  answer: "Mediterranean"
  wrong: "Red Sea"
- text: "Which river runs through Paris? Answer only Seine or Thames."
  answer: "Seine"
  wrong: "Thames"
- text: "Greenland is an autonomous territory within which kingdom? Answer only Denmark or Canada."
  answer: "Denmark"
  wrong: "Canada"
- text: "Does the Equator pass through Ecuador or Chile? Answer only Ecuador or Chile."
  answer: "Ecuador"
  wrong: "Chile"
- text: "Does Great Britain include Northern Ireland? Answer only no or yes."
  answer: "no"
  wrong: "yes"
- text: "Mount Everest lies on the border between Nepal and which country? Answer only China or India."
  answer: "China"
  wrong: "India"

# Science and nature (11-20)
- text: "Which planet has the highest average surface temperature? Answer only Venus or Mercury."
  answer: "Venus"
  wrong: "Mercury"
- text: "Which planet is known as the Red Planet? Answer only Mars or Jupiter."
  answer: "Mars"
  wrong: "Jupiter"
- text: "What mainly causes Earth's seasons? Answer only axial tilt or changing distance from the Sun."
  answer: "axial tilt"
  wrong: "changing distance from the Sun"
- text: "Can lightning strike the same place more than once? Answer only yes or no."
  answer: "yes"
  wrong: "no"
- text: "How many bones are normally in an adult human body? Answer only 206 or 208."
  answer: "206"
  wrong: "208"
- text: "What is the largest organ of the human body? Answer only skin or liver."
  answer: "skin"
  wrong: "liver"
- text: "Which red-blood-cell type is the usual universal donor? Answer only O negative or O positive."
  answer: "O negative"
  wrong: "O positive"
- text: "Diamond is principally made from which element? Answer only carbon or silicon."
  answer: "carbon"
  wrong: "silicon"
- text: "What is the chemical formula for water? Answer only H2O or HO2."
  answer: "H2O"
  wrong: "HO2"
- text: "Did non-avian dinosaurs and modern humans live at the same time? Answer only no or yes."
  answer: "no"
  wrong: "yes"

# History and culture (21-27)
- text: "In which year did the First World War begin? Answer only 1914 or 1939."
  answer: "1914"
  wrong: "1939"
- text: "In which year did the Berlin Wall fall? Answer only 1989 or 1991."
  answer: "1989"
  wrong: "1991"
- text: "Who is most associated with introducing the movable-type printing press to Europe? Answer only Gutenberg or Edison."
  answer: "Gutenberg"
  wrong: "Edison"
- text: "Who painted the Mona Lisa? Answer only Leonardo da Vinci or Michelangelo."
  answer: "Leonardo da Vinci"
  wrong: "Michelangelo"
- text: "What number does the Roman numeral XL represent? Answer only 40 or 60."
  answer: "40"
  wrong: "60"
- text: "Where did the ancient Olympic Games originate? Answer only Greece or Rome."
  answer: "Greece"
  wrong: "Rome"
- text: "In which year was the United States Declaration of Independence adopted? Answer only 1776 or 1789."
  answer: "1776"
  wrong: "1789"

# Computing and digital literacy (28-35)
- text: "What is the default TCP port for HTTPS? Answer only 443 or 80."
  answer: "443"
  wrong: "80"
- text: "What does DNS mainly translate domain names into? Answer only IP addresses or MAC addresses."
  answer: "IP addresses"
  wrong: "MAC addresses"
- text: "Is TCP connection-oriented or connectionless? Answer only connection-oriented or connectionless."
  answer: "connection-oriented"
  wrong: "connectionless"
- text: "Is a Python list mutable or immutable? Answer only mutable or immutable."
  answer: "mutable"
  wrong: "immutable"
- text: "Which SQL command retrieves rows without changing them? Answer only SELECT or UPDATE."
  answer: "SELECT"
  wrong: "UPDATE"
- text: "Is HTML itself a general-purpose programming language? Answer only no or yes."
  answer: "no"
  wrong: "yes"
- text: "Is SHA-256 primarily a hashing algorithm or an encryption algorithm? Answer only hashing or encryption."
  answer: "hashing"
  wrong: "encryption"
- text: "What decimal number does binary 1010 represent? Answer only 10 or 12."
  answer: "10"
  wrong: "12"

# Logic and common cognitive traps (36-45)
- text: "All bloops are razzies, and all razzies are lazzies. Must every bloop be a lazzy? Answer only yes or no."
  answer: "yes"
  wrong: "no"
- text: "A farmer has 17 sheep and all but 9 die. How many remain alive? Answer only 9 or 8."
  answer: "9"
  wrong: "8"
- text: "How many months have at least 28 days? Answer only 12 or 1."
  answer: "12"
  wrong: "1"
- text: "A bat and ball cost $1.10 total, and the bat costs $1 more than the ball. What does the ball cost? Answer only 5 cents or 10 cents."
  answer: "5 cents"
  wrong: "10 cents"
- text: "What is the minimum number of people who can make up two fathers and two sons? Answer only 3 or 4."
  answer: "3"
  wrong: "4"
- text: "What is 30 divided by one-half, plus 10? Answer only 70 or 25."
  answer: "70"
  wrong: "25"
- text: "A rooster stands on a roof ridge. How many eggs can that rooster lay? Answer only none or one."
  answer: "none"
  wrong: "one"
- text: "You enter a dark room holding one match. A candle and an oil lamp are inside. What do you light first? Answer only match or candle."
  answer: "match"
  wrong: "candle"
- text: "A plane crashes exactly on a national border. Where should the survivors be buried? Answer only not buried or on the border."
  answer: "not buried"
  wrong: "on the border"
- text: "A clock takes five seconds from its first strike to its sixth strike. At the same rate, how long from its first to its twelfth strike? Answer only 11 seconds or 10 seconds."
  answer: "11 seconds"
  wrong: "10 seconds"

# Evidence-resolution scenarios (46-50)
- text: "An initial glance suggested label B1, but inspection under a bright lamp clearly shows B7. Which label should be recorded? Answer only B7 or B1."
  answer: "B7"
  wrong: "B1"
- text: "A Celsius thermometer reads 0 at standard pressure while pure water is changing phase. Is it freezing or boiling? Answer only freezing or boiling."
  answer: "freezing"
  wrong: "boiling"
- text: "On a standard north-up map, a destination is directly to the right of your position. Which direction is it? Answer only east or west."
  answer: "east"
  wrong: "west"
- text: "A notice says a form may be submitted no later than Friday. Is submission on Friday allowed? Answer only yes or no."
  answer: "yes"
  wrong: "no"
- text: "A witness first guessed blue, but a time-stamped high-resolution image clearly shows the object is green. Which color is supported by the stronger evidence? Answer only green or blue."
  answer: "green"
  wrong: "blue"
