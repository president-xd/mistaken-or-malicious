# Star representative: 3 malicious agents on spokes (Agent_B, Agent_C, Agent_D).
# In a 7-agent star there are two distinct 3-liar structures: hub+2-spokes and 3-spokes.
questions_file: "data/tricky_questions_50.yaml"
max_questions: 50
provider: "deepseek"
model: "deepseek-v4-pro"
embed_model: "nomic-embed-text"
agents: 7
rounds: 5
topology: "star"
topologies: []
share: "answer"
seed: 1
attackers: 3
attacker_places: "1,2,3"
attacker_answer: ""
sleeper: false
trust: true
scoring: "answer"
start_trust: 0.5
trust_memory: 0.8
weight_agree: 0.333
weight_consist: 0.333
weight_anomaly: 0.333
trust_floor: 0.0
trust_carry_over: true
sharpen: true
warmup: 0
trust_gamma: 2.0
trust_learn_on: "all"
trust_learn_share: 0.5
hear_yourself: false
agreeableness: ""
persuasion: ""
parallel: true
repeats: 1
run_name: "star50_liars-3_seats-B-C-D"
skip_done: true
compare_baseline: false
network_vs_network: false
