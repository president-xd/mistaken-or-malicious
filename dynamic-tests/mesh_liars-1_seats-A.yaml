# Mesh representative: 1 malicious agent at Agent_A.
# Symmetry class: every mesh seat is equivalent, so this one file represents all 7 possible one-liar placements (orbit size 7).
# Placement: Agent_A is connected to all six other agents; choosing B-G instead would produce the same graph structure.
# Controls: 7 total agents, 50 questions, 5 rounds per question, and dynamic trust enabled.
# Model: DeepSeek V4 Pro in default thinking mode, the current DeepSeek Reasoner replacement.
questions_file: "data/tricky_questions_50.yaml"
max_questions: 50
provider: "deepseek"
model: "deepseek-v4-pro"
embed_model: "nomic-embed-text"
agents: 7
rounds: 5
topology: "mesh"
topologies: []
share: "answer"
seed: 1
attackers: 1
attacker_places: "0"
attacker_answer: ""
sleeper: false
trust: true
scoring: "answer"
start_trust: 0.5
trust_memory: 0.8
weight_agree: 0.333
weight_consist: 0.333
weight_anomaly: 0.333
trust_floor: 0.0
trust_carry_over: true
sharpen: true
warmup: 0
trust_gamma: 2.0
trust_learn_on: "all"
trust_learn_share: 0.5
hear_yourself: false
agreeableness: ""
persuasion: ""
parallel: true
repeats: 1
run_name: "mesh50_liars-1_seats-A"
skip_done: true
compare_baseline: false
network_vs_network: false
