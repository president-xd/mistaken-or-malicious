# THE STRONG ATTACK
# Everything here is chosen to give the liar the best possible chance, so the
# baseline actually fails and the trust defence has room to show its value.

model: "llama3.1:8b-instruct-q8_0"    # 8 billion. A 1B model cannot do this
embed_model: "nomic-embed-text"

# 1. Questions where the wrong answer is a common misconception, sorted with
#    the most persuadable first. Arithmetic does not work: the model refuses
#    to defend an obviously false sum.
questions_file: "data/hard_questions.yaml"
max_questions: 3                      # 1 warm-up + 2 scored

# 2. The liar sits at the HUB of a star. Every honest agent hears ONLY the
#    liar, and never hears another honest agent. This is the most power a
#    single liar can have.
agents: 4
topology: "star"
attackers: 1
attacker_places: "center"

# 3. More rounds, so the liar has more chances to talk people round.
rounds: 5

# 4. Make the liar pushy and hard to move, and the honest agents easy to move.
#    Agent 0 is the liar (the hub).
persuasion:    "high,medium,medium,medium"
agreeableness: "low,high,high,high"

seed: 1
scoring: "answer"
parallel: true

# The defence, at its best settings
trust: true
trust_memory: 0.8
weight_agree: 0.5
weight_consist: 0.0
weight_anomaly: 0.5
warmup: 1

# Run it twice: no trust first, then trust, and compare
compare_baseline: true
repeats: 5                  # five runs of the whole thing, averaged. A single
                            # run of this setup is inside the noise: with 3
                            # honest agents one changed mind is worth 33 points.
run_name: "strong_attack"
